# Deploys to the client's own GoDaddy hosting, not the Kallistesoft one, so this
# doesn't use the shared deploy-ftp.yml or the FTP_* secrets. OTTAVI_FTP_SERVER,
# OTTAVI_FTP_USERNAME and OTTAVI_FTP_PASSWORD are organization secrets. The FTP
# account must be rooted at the site's document root.
name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-ottavilawfirm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain HTML, no build step: copy the site without repo-only files.
      - run: |
          mkdir site
          rsync -a --exclude site --exclude .git --exclude .github --exclude .gitignore --exclude design --exclude tools \
            --exclude README.md --exclude FOLLOW-UP.md ./ site/
      # Only changed files are sent: the action keeps a state file in the
      # target folder and deletes only files it uploaded itself.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OTTAVI_FTP_SERVER }}
          username: ${{ secrets.OTTAVI_FTP_USERNAME }}
          password: ${{ secrets.OTTAVI_FTP_PASSWORD }}
          protocol: ftps
          local-dir: site/
          server-dir: ./
          timeout: 60000
