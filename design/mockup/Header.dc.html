<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>En-tête Ottavi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Lato:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="background: #232323; border-bottom: 1px solid #45423C; font-family: 'Lato', sans-serif; color: #FFFFFF;">
  <div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px;">
    <a href="{{homeHref}}" aria-label="{{homeLabel}}" style="text-decoration: none; display: flex; align-items: center; gap: 14px; min-height: 44px;">
      <span aria-hidden="true" style="display: flex; gap: 4px; height: 44px;"><span style="width: 2px; background: #9B3F78;"></span><span style="width: 2px; background: #9B3F78;"></span></span>
      <span style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-family: 'Cinzel', serif; font-size: 24px; line-height: 1; letter-spacing: 0.2em; color: #D9CC8C;">OTTAVI</span>
        <span style="font-family: 'Cinzel', serif; font-size: 9px; line-height: 1; letter-spacing: 0.52em; color: #FFFFFF;">LAW FIRM INC.</span>
      </span>
    </a>
    <nav aria-label="{{navLabel}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 26px;">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
        <a href="{{item.href}}" style="{{item.style}}">{{item.label}}</a>
      </sc-for>
    </nav>
    <div style="display: flex; align-items: center; gap: 18px;">
      <div aria-label="{{langLabel}}" style="display: flex; align-items: center; gap: 2px; font-size: 13px; letter-spacing: 0.12em;">
        <a href="Main.dc.html" lang="fr" style="{{frStyle}}">FR</a>
        <span aria-hidden="true" style="color: #6E6A62;">|</span>
        <a href="Home-EN.dc.html" lang="en" style="{{enStyle}}">EN</a>
      </div>
      <a href="Contact.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; background: #D9CC8C; color: #232323; text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;">{{cta}}</a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fr","en"],"default":"fr"},"active":{"editor":"enum","options":["home","services","ressources","cabinet","contact"],"default":"home"},"$preview":{"width":1440,"height":90}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'fr';
    const active = this.props.active ?? 'home';
    const en = lang === 'en';
    const defs = [
      { key: 'services', fr: 'Services', en: 'Services', href: 'Services.dc.html' },
      { key: 'ressources', fr: 'Ressources', en: 'Resources', href: 'Ressources.dc.html' },
      { key: 'cabinet', fr: 'Le cabinet', en: 'The firm', href: 'Cabinet.dc.html' },
      { key: 'contact', fr: 'Contact', en: 'Contact', href: 'Contact.dc.html' }
    ];
    const base = 'display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; ';
    const items = defs.map((d) => ({
      label: en ? d.en : d.fr,
      href: d.href,
      style: base + (d.key === active
        ? 'color: #D9CC8C; box-shadow: inset 0 -2px 0 #9B3F78;'
        : 'color: #E8E4DA;')
    }));
    const langBase = 'display: inline-flex; align-items: center; justify-content: center; min-width: 36px; min-height: 44px; text-decoration: none; ';
    return {
      items,
      homeHref: en ? 'Home-EN.dc.html' : 'Main.dc.html',
      homeLabel: en ? 'Ottavi Law Firm Inc. — home' : 'Ottavi Law Firm Inc. — accueil',
      navLabel: en ? 'Main' : 'Principale',
      langLabel: en ? 'Language' : 'Langue',
      cta: en ? 'Book' : 'Réserver',
      frStyle: langBase + (en ? 'color: #CFCBC0;' : 'color: #D9CC8C; font-weight: 700;'),
      enStyle: langBase + (en ? 'color: #D9CC8C; font-weight: 700;' : 'color: #CFCBC0;')
    };
  }
}
</script>
</body>
</html>
