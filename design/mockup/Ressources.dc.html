<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ressources — Ottavi Law Firm Inc.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Lato:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="background: #F7F5EE; color: #2E2E2E; font-family: 'Lato', sans-serif;">
  <dc-import name="Header" lang="fr" active="ressources" hint-size="100%,90px"></dc-import>

  <main>
    <section style="background: #2E2E2E; color: #FFFFFF;">
      <div style="max-width: 1240px; margin: 0 auto; padding: clamp(48px, 6vw, 80px) 24px; box-sizing: border-box; display: flex; gap: 28px; align-items: stretch;">
        <span aria-hidden="true" style="display: flex; gap: 6px;"><span style="width: 2px; background: #9B3F78;"></span><span style="width: 2px; background: #9B3F78;"></span></span>
        <h1 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 400; font-size: clamp(32px, 4vw, 54px); line-height: 1.15;">Ressources</h1>
      </div>
    </section>

    <!-- Guide -->
    <section id="guide" style="border-bottom: 1px solid #E2DDD0;">
      <div style="max-width: 1240px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px 72px; align-items: flex-start;">
        <div style="flex: 1 1 460px; min-width: 0; display: flex; flex-wrap: wrap; gap: 32px;">
          <div aria-hidden="true" style="flex: 0 0 200px; height: 266px; background: #2E2E2E; display: flex; gap: 14px; padding: 22px; box-sizing: border-box;">
            <span style="display: flex; gap: 4px;"><span style="width: 2px; background: #9B3F78;"></span><span style="width: 2px; background: #9B3F78;"></span></span>
            <span style="display: flex; flex-direction: column; justify-content: space-between;">
              <span style="font-family: 'Cinzel', serif; font-size: 22px; line-height: 1.2; color: #D9CC8C;">Immigrer au Canada</span>
              <span style="font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.3em; color: #FFFFFF;">ÉDITION 2026</span>
            </span>
          </div>
          <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
            <h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 400; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.2;">Guide « Immigrer au Canada » (édition 2026)</h2>
            <ul style="margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.8;">
              <li>Les 5 principales voies d'immigration</li>
              <li>Le fonctionnement d'Entrée express</li>
              <li>Les 5 erreurs qui coûtent cher aux candidats</li>
            </ul>
          </div>
        </div>
        <form aria-label="Recevoir le guide" style="flex: 1 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #E2DDD0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700;">Courriel <span style="font-weight: 400; color: #5A5650;">(requis)</span>
            <input type="email" required="" autocomplete="email" style="min-height: 48px; padding: 0 14px; border: 1px solid #8C877C; background: #FFFFFF; font-family: 'Lato', sans-serif; font-size: 16px; box-sizing: border-box;">
          </label>
          <div style="display: flex; flex-wrap: wrap; gap: 16px;">
            <label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700;">Prénom <span style="font-weight: 400; color: #5A5650;">(requis)</span>
              <input type="text" required="" autocomplete="given-name" style="min-height: 48px; padding: 0 14px; border: 1px solid #8C877C; background: #FFFFFF; font-family: 'Lato', sans-serif; font-size: 16px; box-sizing: border-box;">
            </label>
            <label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700;">Nom <span style="font-weight: 400; color: #5A5650;">(requis)</span>
              <input type="text" required="" autocomplete="family-name" style="min-height: 48px; padding: 0 14px; border: 1px solid #8C877C; background: #FFFFFF; font-family: 'Lato', sans-serif; font-size: 16px; box-sizing: border-box;">
            </label>
          </div>
          <button type="submit" style="min-height: 52px; background: #2E2E2E; color: #D9CC8C; border: 0; font-family: 'Lato', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Recevoir le guide</button>
        </form>
      </div>
    </section>

    <!-- CV -->
    <section id="cv">
      <div style="max-width: 1240px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px 72px; align-items: flex-start;">
        <div style="flex: 1 1 460px; min-width: 0; display: flex; flex-wrap: wrap; gap: 32px;">
          <div aria-hidden="true" style="flex: 0 0 200px; height: 266px; background: #FFFFFF; border: 1px solid #CFCAB9; display: flex; flex-direction: column; padding: 24px 20px; box-sizing: border-box; gap: 10px;">
            <span style="height: 12px; width: 70%; background: #2E2E2E;"></span>
            <span style="height: 7px; width: 45%; background: #9B3F78;"></span>
            <span style="height: 1px; background: #CFCAB9; margin: 10px 0;"></span>
            <span style="height: 6px; width: 90%; background: #DDD8CA;"></span>
            <span style="height: 6px; width: 80%; background: #DDD8CA;"></span>
            <span style="height: 6px; width: 85%; background: #DDD8CA;"></span>
            <span style="height: 7px; width: 40%; background: #9B3F78; margin-top: 12px;"></span>
            <span style="height: 6px; width: 90%; background: #DDD8CA;"></span>
            <span style="height: 6px; width: 75%; background: #DDD8CA;"></span>
            <span style="height: 6px; width: 82%; background: #DDD8CA;"></span>
          </div>
          <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
            <span style="align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #FFFFFF; background: #9B3F78; padding: 5px 10px;">Gratuit</span>
            <h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 400; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.2;">Modèle de CV au format canadien</h2>
          </div>
        </div>
        <form aria-label="Recevoir le modèle de CV" style="flex: 1 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #E2DDD0; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
          <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700;">Courriel <span style="font-weight: 400; color: #5A5650;">(requis)</span>
            <input type="email" required="" autocomplete="email" style="min-height: 48px; padding: 0 14px; border: 1px solid #8C877C; background: #FFFFFF; font-family: 'Lato', sans-serif; font-size: 16px; box-sizing: border-box;">
          </label>
          <button type="submit" style="min-height: 52px; background: #2E2E2E; color: #D9CC8C; border: 0; font-family: 'Lato', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Recevoir le modèle</button>
        </form>
      </div>
    </section>
  </main>

  <dc-import name="Footer" lang="fr" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
